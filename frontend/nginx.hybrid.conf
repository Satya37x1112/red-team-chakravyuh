# Hybrid dev config: the dashboard container proxies /api and /ws to the
# backend running NATIVELY on the Windows host (so telemetry reads the real
# Windows machine, not a Linux container). host.docker.internal resolves to the
# host from inside Docker Desktop. Swap back to nginx.conf (-> backend:8077) for
# the all-in-Docker setup.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://host.docker.internal:8077;
        proxy_set_header Host $host;
    }

    location /ws {
        proxy_pass http://host.docker.internal:8077;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
