services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chakravyuh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in chakravyuh/.env}
      POSTGRES_DB: chakravyuh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://chakravyuh:${POSTGRES_PASSWORD}@db:5432/chakravyuh
    depends_on:
      - db
    ports:
      - "8077:8077"

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
